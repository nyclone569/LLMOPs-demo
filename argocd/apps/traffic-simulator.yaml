apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traffic-simulator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: llmops

  source:
    repoURL: https://github.com/nyclone569/LLMOPs.git
    targetRevision: main
    path: argocd/traffic-simulator

  destination:
    server: https://kubernetes.default.svc
    namespace: litellm

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true

    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: batch
      kind: Job
      jsonPointers:
        - /spec/selector
        - /spec/template/metadata/labels

  info:
    - name: Description
      value: Synthetic traffic simulator - 290 users, 5 teams, burst windows
