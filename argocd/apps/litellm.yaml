apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: llmops

  # Source: Custom Helm chart or manifests from Git
  # Since LiteLLM doesn't have an official Helm chart, we'll use a custom approach
  source:
    repoURL: https://github.com/nyclone569/LLMOPs.git
    targetRevision: main
    path: argocd/helm-values/litellm-chart  # Custom chart directory
    helm:
      releaseName: litellm
      valueFiles:
        - ../litellm-values.yaml

  # Destination: litellm namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: litellm

  # Automated sync policy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Ignore differences in dynamic fields
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: networking.k8s.io
      kind: Ingress
      jsonPointers:
        - /status
        - /metadata/annotations/alb.ingress.kubernetes.io~1load-balancer-name

  # Health assessment
  info:
    - name: Description
      value: LiteLLM proxy gateway for unified LLM API access
    - name: URL
      value: https://gateway.internal.yourdomain.com
