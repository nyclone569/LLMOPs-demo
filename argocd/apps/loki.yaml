apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: llmops

  # Source: Grafana Loki Helm chart
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 5.47.0
    helm:
      releaseName: loki
      values: |
        # Deployment mode: simple scalable (single binary mode)
        deploymentMode: SingleBinary

        loki:
          auth_enabled: false

          commonConfig:
            replication_factor: 1

          storage:
            type: 'filesystem'

          schemaConfig:
            configs:
              - from: 2024-01-01
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h

          limits_config:
            retention_period: 14d
            max_query_series: 10000
            max_query_parallelism: 32

          querier:
            max_concurrent: 4

          # Compactor enforces retention_period above — without it logs
          # are queryable past 14d (only TSDB index ages out, chunks stay).
          compactor:
            working_directory: /var/loki/compactor
            compaction_interval: 10m
            retention_enabled: true
            retention_delete_delay: 2h
            retention_delete_worker_count: 150
            delete_request_store: filesystem

        # Single binary deployment
        singleBinary:
          replicas: 1

          persistence:
            enabled: true
            storageClass: gp3
            size: 30Gi

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        # Gateway (nginx)
        gateway:
          enabled: true
          replicas: 1

          service:
            type: ClusterIP
            port: 80

          ingress:
            enabled: true
            ingressClassName: alb
            annotations:
              alb.ingress.kubernetes.io/scheme: internal
              alb.ingress.kubernetes.io/target-type: ip
              alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
              alb.ingress.kubernetes.io/tags: "Environment=production,Project=llmops,Component=loki,Owner=nghiatd,Cluster=llmops-cluster"
              alb.ingress.kubernetes.io/load-balancer-name: "llmops-loki"
            hosts:
              - host: ""  # Use AWS-provided ALB DNS name
                paths:
                  - path: /
                    pathType: Prefix
            tls: []

        # Monitoring
        monitoring:
          dashboards:
            enabled: false

          serviceMonitor:
            enabled: true

          selfMonitoring:
            enabled: false
            grafanaAgent:
              installOperator: false

        # Test
        test:
          enabled: false

  # Destination: loki namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: loki

  # Automated sync policy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Health assessment
  info:
    - name: Description
      value: Loki for log aggregation and querying
    - name: URL
      value: "Use kubectl get ingress -n loki for ALB DNS"
