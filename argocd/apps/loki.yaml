apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: llmops

  # Source: Grafana Loki Helm chart
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 5.47.0
    helm:
      releaseName: loki
      values: |
        # Deployment mode: simple scalable (single binary mode)
        deploymentMode: SingleBinary

        loki:
          auth_enabled: false

          commonConfig:
            replication_factor: 1

          storage:
            type: 's3'
            bucketNames:
              chunks: loki-chunks
              ruler: loki-ruler
              admin: loki-admin
            s3:
              # Configure S3 bucket for log storage
              # For demo, use filesystem
              endpoint: null
              region: ap-southeast-1

          schemaConfig:
            configs:
              - from: 2024-01-01
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: index_
                  period: 24h

          limits_config:
            retention_period: 14d
            max_query_series: 10000
            max_query_parallelism: 32

          querier:
            max_concurrent: 4

        # Single binary deployment
        singleBinary:
          replicas: 1

          persistence:
            enabled: true
            storageClass: gp3
            size: 30Gi

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        # Gateway (nginx)
        gateway:
          enabled: true
          replicas: 1

          service:
            type: ClusterIP
            port: 80

          ingress:
            enabled: true
            ingressClassName: alb
            annotations:
              alb.ingress.kubernetes.io/scheme: internal
              alb.ingress.kubernetes.io/target-type: ip
              alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
            hosts:
              - host: ""  # Use AWS-provided ALB DNS name
                paths:
                  - path: /
                    pathType: Prefix
            tls: []

        # Monitoring
        monitoring:
          serviceMonitor:
            enabled: true

          selfMonitoring:
            enabled: false
            grafanaAgent:
              installOperator: false

        # Test
        test:
          enabled: false

  # Destination: loki namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: loki

  # Automated sync policy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Health assessment
  info:
    - name: Description
      value: Loki for log aggregation and querying
    - name: URL
      value: "Use kubectl get ingress -n loki for ALB DNS"
