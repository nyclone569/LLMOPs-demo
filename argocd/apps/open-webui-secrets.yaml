apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: llmops

  source:
    repoURL: https://github.com/nyclone569/LLMOPs.git
    targetRevision: main
    path: argocd/external-secrets
    directory:
      include: "open-webui-secrets.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: open-webui

  syncPolicy:
    automated:
      prune: true            # Prune stale secret manifests removed from Git
      selfHeal: true         # Still heal drifting secrets
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status

  info:
    - name: Description
      value: ExternalSecrets for open-webui namespace from AWS Secrets Manager
