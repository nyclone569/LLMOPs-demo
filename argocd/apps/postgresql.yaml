apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: llmops

  sources:
    - repoURL: https://github.com/nyclone569/LLMOPs.git
      targetRevision: main
      path: argocd/manifests
      directory:
        include: "postgresql.yaml"
    - repoURL: https://github.com/nyclone569/LLMOPs.git
      targetRevision: main
      path: argocd/external-secrets
      directory:
        include: "postgresql-secret.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: postgresql

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
    - group: ""
      kind: Secret
      jsonPointers:
        - /data

  info:
    - name: Description
      value: PostgreSQL database shared by LiteLLM and Langfuse
