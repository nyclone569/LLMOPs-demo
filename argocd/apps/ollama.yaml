apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: llmops

  source:
    repoURL: https://helm.otwld.com/
    chart: ollama
    targetRevision: "*"
    helm:
      releaseName: ollama
      values: |
        replicaCount: 1

        ollama:
          gpu:
            enabled: false
          models:
            pull:
              - llama3.2

        extraEnv:
          - name: OLLAMA_NUM_PARALLEL
            value: "1"
          - name: OLLAMA_MAX_LOADED_MODELS
            value: "1"
          - name: OLLAMA_FLASH_ATTENTION
            value: "1"
          - name: OLLAMA_KEEP_ALIVE
            value: "5m"

        persistentVolume:
          enabled: true
          size: 50Gi
          storageClass: gp3

        resources:
          requests:
            cpu: "500m"
            memory: "3Gi"
          limits:
            cpu: "1900m"
            memory: "6Gi"

        service:
          type: ClusterIP
          port: 11434

        ingress:
          enabled: false

        podAnnotations:
          app.kubernetes.io/part-of: llmops-platform

  destination:
    server: https://kubernetes.default.svc
    namespace: ollama

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs

  info:
    - name: Description
      value: Ollama LLM server (CPU, llama3.2) — GPU pending quota approval
    - name: Models
      value: llama3.2
