apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: llmops

  source:
    repoURL: https://helm.otwld.com/
    chart: ollama
    targetRevision: "*"
    helm:
      releaseName: ollama
      values: |
        replicaCount: 1

        ollama:
          gpu:
            enabled: true
            type: nvidia
            number: 1
          models:
            pull:
              - qwen2.5-coder:7b

        persistentVolume:
          enabled: true
          size: 50Gi
          storageClass: gp3

        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4000m"
            memory: "14Gi"
            nvidia.com/gpu: "1"

        nodeSelector:
          nodegroup: gpu

        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule

        service:
          type: ClusterIP
          port: 11434

        ingress:
          enabled: false

        podAnnotations:
          app.kubernetes.io/part-of: llmops-platform

  destination:
    server: https://kubernetes.default.svc
    namespace: ollama

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs

  info:
    - name: Description
      value: Ollama LLM server with GPU (g4dn.xlarge, NVIDIA T4)
    - name: Models
      value: qwen2.5-coder:7b
