# LiteLLM Helm Values for LLMOps Platform
# Purpose: Unified LLM proxy gateway with observability

# ============================================================================
# IMAGE CONFIGURATION
# ============================================================================
image:
  repository: ghcr.io/berriai/litellm-non_root
  tag: "main-latest"  # Or pin to specific version like "main-v1.0.0"
  pullPolicy: IfNotPresent

# ============================================================================
# DEPLOYMENT
# ============================================================================
replicaCount: 3

# ============================================================================
# RESOURCES
# ============================================================================
resources:
  requests:
    memory: "1100Mi"
    cpu: "100m"   # reduced from 200m — easier to schedule; limit handles actual burst
  limits:
    memory: "2Gi"
    cpu: "1000m"  # increased from 500m — prevents CPU throttle under 100-500 RPM load

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
env:
  # Master key for API authentication
  - name: LITELLM_MASTER_KEY
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: LITELLM_MASTER_KEY

  # Salt key for encryption
  - name: LITELLM_SALT_KEY
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: LITELLM_SALT_KEY

  # Database URL for spend tracking and logging.
  # Build inline from POSTGRESQL_PASSWORD (the in-cluster Bitnami chart's
  # actual password). Using a pre-baked URL from a separate Secrets Manager
  # entry drifts whenever the postgres password rotates.
  - name: POSTGRESQL_PASSWORD
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: POSTGRESQL_PASSWORD
  - name: DATABASE_URL
    value: "postgres://postgres:$(POSTGRESQL_PASSWORD)@postgresql-primary.postgresql.svc.cluster.local:5432/postgres"

  # Redis URL for caching
  - name: REDIS_HOST
    value: "redis-master.redis.svc.cluster.local"

  - name: REDIS_PORT
    value: "6379"

  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: REDIS_PASSWORD

  # Langfuse callback configuration
  - name: LANGFUSE_PUBLIC_KEY
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: LANGFUSE_PUBLIC_KEY

  - name: LANGFUSE_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: LANGFUSE_SECRET_KEY

  - name: LANGFUSE_HOST
    value: "http://langfuse-web.langfuse.svc.cluster.local:3000"

  # Provider API keys
  - name: OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: OPENAI_API_KEY

  - name: ANTHROPIC_API_KEY
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: ANTHROPIC_API_KEY

  - name: GEMINI_API_KEY
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: GEMINI_API_KEY

  # LiteLLM settings
  - name: LITELLM_LOG
    value: "INFO"

  - name: JSON_LOGS
    value: "true"

  # Set writable directory for LiteLLM migrations
  - name: LITELLM_MIGRATION_DIR
    value: "/tmp/litellm-migrations"

# ============================================================================
# LITELLM CONFIG
# ============================================================================
# LiteLLM configuration file (config.yaml)
config:
  model_list:
    # Fast Chat - General internal chat (latency-based load balanced)
    - model_name: fast-chat
      litellm_params:
        model: gpt-4o-mini
        api_key: os.environ/OPENAI_API_KEY
      model_info:
        mode: chat
        supports_function_calling: true

    - model_name: fast-chat
      litellm_params:
        model: gemini/gemini-2.0-flash
        api_key: os.environ/GEMINI_API_KEY
      model_info:
        mode: chat

    # Coding Assistant - Engineering and code review
    - model_name: coding-assistant
      litellm_params:
        model: claude-sonnet-4-6
        api_base: https://vip.digishop.work
        api_key: os.environ/ANTHROPIC_API_KEY
      model_info:
        mode: chat
        supports_function_calling: true

    - model_name: coding-assistant
      litellm_params:
        model: gpt-4o-mini
        api_key: os.environ/OPENAI_API_KEY
      model_info:
        mode: chat

    # Private Chat - Bedrock Nova Lite via APAC cross-region inference profile
    # Falls back to gpt-4o-mini when Bedrock daily token quota is exhausted
    - model_name: private-chat
      litellm_params:
        model: bedrock/apac.amazon.nova-lite-v1:0
        aws_region_name: ap-southeast-1
      model_info:
        mode: chat

    - model_name: private-chat
      litellm_params:
        model: gpt-4o-mini
        api_key: os.environ/OPENAI_API_KEY
      model_info:
        mode: chat

    # Long Context - Large document analysis
    - model_name: long-context
      litellm_params:
        model: gemini/gemini-2.0-flash
        api_key: os.environ/GEMINI_API_KEY
      model_info:
        mode: chat
        max_tokens: 1048576

    - model_name: long-context
      litellm_params:
        model: gpt-4o
        api_key: os.environ/OPENAI_API_KEY
      model_info:
        mode: chat
        max_tokens: 128000

    # Fallback Model - Backup when primary aliases fail
    - model_name: fallback-model
      litellm_params:
        model: gpt-4o-mini
        api_key: os.environ/OPENAI_API_KEY
      model_info:
        mode: chat

    # Claude models via custom Anthropic-compatible endpoint
    - model_name: claude-sonnet
      litellm_params:
        model: claude-sonnet-4-6
        api_base: https://vip.digishop.work
        api_key: os.environ/ANTHROPIC_API_KEY
      model_info:
        mode: chat

    - model_name: claude-haiku
      litellm_params:
        model: claude-haiku-4-5-20251001
        api_base: https://vip.digishop.work
        api_key: os.environ/ANTHROPIC_API_KEY
      model_info:
        mode: chat

    # Individual models - selectable directly in Open WebUI
    - model_name: gpt-4o
      litellm_params:
        model: gpt-4o
        api_key: os.environ/OPENAI_API_KEY
      model_info:
        mode: chat

    - model_name: gpt-4o-mini
      litellm_params:
        model: gpt-4o-mini
        api_key: os.environ/OPENAI_API_KEY
      model_info:
        mode: chat

    - model_name: gemini-2.0-flash
      litellm_params:
        model: gemini/gemini-2.0-flash
        api_key: os.environ/GEMINI_API_KEY
      model_info:
        mode: chat

  # Router settings for load balancing and fallbacks
  router_settings:
    routing_strategy: latency-based-routing
    num_retries: 2
    timeout: 60
    fallbacks:
      # Load-test profile: only the OpenAI key is currently known-good, so all
      # non-GPT aliases fall back to gpt-4o-mini before running autoscaling tests.
      - fast-chat:        [gpt-4o-mini]
      - coding-assistant: [gpt-4o-mini]
      - long-context:     [gpt-4o-mini]
      - fallback-model:   [gpt-4o-mini]
      - gpt-4o:           [gpt-4o-mini]
      - gemini-2.0-flash: [gpt-4o-mini]
      - claude-haiku:     [gpt-4o-mini]
      - claude-sonnet:    [gpt-4o-mini]
      - private-chat:     [gpt-4o-mini]
    allowed_fails: 3
    cooldown_time: 60
    retry_policy:
      AuthenticationError: 0
    allowed_fails_policy:
      AuthenticationErrorAllowedFails: 1

  # Model-specific rate limits and timeouts
  model_settings:
    - model_name: coding-assistant
      litellm_params:
        rpm: 100
        max_tokens: 4096
        temperature: 0.3

    - model_name: long-context
      litellm_params:
        rpm: 20
        timeout: 120

    - model_name: private-chat
      litellm_params:
        rpm: 10
        timeout: 300

  # LiteLLM settings
  litellm_settings:
    # Callbacks for Langfuse observability
    success_callback: ["langfuse", "prometheus"]
    failure_callback: ["langfuse", "prometheus"]

    # Redis caching
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      password: os.environ/REDIS_PASSWORD
      ttl: 3600

    # Logging
    json_logs: true

    # Sensitive data masking — applied to both proxy logs and Langfuse traces.
    # We keep non-sensitive virtual-key identifiers (user_id, team_alias, key
    # alias, model) flowing into both Loki failure-path lines and Langfuse so
    # that Requirements §5.1 (Langfuse user_id/team/model) and §5.3 (Loki
    # search by user_id / model alias) are satisfied.
    #
    # Known leak into Langfuse: user_api_key_hash (SHA-256 of the virtual key,
    # not the upstream provider key) and user_api_key_user_email (currently
    # empty — none of the virtual keys created by argocd/rbac-setup carry an
    # email). LiteLLM's standard_logging_payload_excluded_fields setting is a
    # no-op for the Langfuse callback (the langfuse integration reads
    # litellm_params['metadata'] directly, not the StandardLoggingPayload), so
    # we don't bother setting it. Mitigation per §7.1: Langfuse access is
    # admin-only, separating these prompt traces from ops logs per §7.3. If
    # virtual keys ever get user_email populated, see
    # docs/superpowers/specs/2026-06-12-litellm-langfuse-metadata-scrubber-design.md
    # for the deferred custom CustomLogger approach (Option B).
    #
    # redact_messages_in_exceptions stays on so prompt content cannot leak via
    # tracebacks. turn_off_message_logging stays off so Langfuse keeps full
    # prompt/response traces.
    redact_user_api_key_info: false
    redact_messages_in_exceptions: true
    turn_off_message_logging: false

    # Allow Prometheus to scrape /metrics without the master key.
    # Safe: /metrics is ClusterIP-only, not exposed via Ingress.
    require_auth_for_metrics_endpoint: false

    # Request handling
    drop_params: true
    max_parallel_requests: 100

  # Guardrails — regex-based PII masking applied pre-call so secrets/PII
  # never reach upstream providers or observability sinks.
  # NOTE: Disabled — LiteLLM main-latest does not yet support guardrail type "regex".
  # Re-enable when upgrading to a version with regex guardrail support.
  # guardrails:
  #   - guardrail_name: "pii-mask-pre-call"
  #     litellm_params:
  #       guardrail: regex
  #       mode: "pre_call"
  #       default_on: true
  #       regex_rules:
  #         - pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
  #           replacement: "[EMAIL_REDACTED]"
  #         - pattern: '\b(?:\+?\d{1,3}[\s-]?)?\(?\d{3}\)?[\s-]?\d{3}[\s-]?\d{4}\b'
  #           replacement: "[PHONE_REDACTED]"
  #         - pattern: '\b\d{4}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}\b'
  #           replacement: "[CARD_REDACTED]"
  #         - pattern: '\b\d{3}-\d{2}-\d{4}\b'
  #           replacement: "[SSN_REDACTED]"
  #         - pattern: '(?i)(api[_-]?key|secret|token|password)["\s:=]+[A-Za-z0-9_\-\.]{16,}'
  #           replacement: "[SECRET_REDACTED]"
  #         - pattern: 'sk-[A-Za-z0-9]{20,}'
  #           replacement: "[API_KEY_REDACTED]"
  #         - pattern: 'AKIA[0-9A-Z]{16}'
  #           replacement: "[AWS_KEY_REDACTED]"

  # General settings - budget, rate limits, auth
  general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY
    database_url: os.environ/DATABASE_URL

    # Global rate limits
    rpm: 1000
    tpm: 1000000

    # Budget limits (USD per month, platform-wide)
    budget_duration: 30d
    max_budget: 6000

    # Team-based model restrictions are managed via the LiteLLM admin API.
    # Use POST /team and POST /key with the `models` field to restrict which
    # aliases each team can access. Example team model allowlists:
    #
    # default_team_settings:
    #   - team_alias: engineering
    #     models: [coding-assistant, fast-chat, long-context]
    #   - team_alias: support
    #     models: [fast-chat]
    #   - team_alias: product
    #     models: [fast-chat]
    #   - team_alias: operations
    #     models: [fast-chat]
    #   - team_alias: executives
    #     models: [fast-chat, long-context]
    #
    # Apply via: litellm admin API POST /team/new or PATCH /team
    # with body: {"team_alias": "<name>", "models": ["<alias>", ...]}

# ============================================================================
# SERVICE
# ============================================================================
service:
  type: ClusterIP
  port: 4000
  targetPort: 4000
  annotations: {}

# ============================================================================
# INGRESS
# ============================================================================
ingress:
  enabled: true
  className: alb
  annotations:
    # ALB configuration
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

    # Health check
    alb.ingress.kubernetes.io/healthcheck-path: /health/liveness
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"

    # Tags
    alb.ingress.kubernetes.io/tags: "Environment=production,Project=llmops,Component=litellm,Owner=nghiatd,Cluster=llmops-cluster"
    alb.ingress.kubernetes.io/load-balancer-name: "llmops-litellm"

  hosts:
    - host: ""  # Use AWS-provided ALB DNS name
      paths:
        - path: /
          pathType: Prefix

  tls: []

# ============================================================================
# HEALTH CHECKS
# ============================================================================
livenessProbe:
  httpGet:
    path: /health
    port: 4000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 4000
  initialDelaySeconds: 20
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3


# ============================================================================
# SECURITY CONTEXT
# ============================================================================
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

# ============================================================================
# POD DISRUPTION BUDGET
# ============================================================================
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ============================================================================
# AUTOSCALING
# ============================================================================
autoscaling:
  enabled: true
  minReplicas: 2                       # reduced from 3; 2 pods idle is enough baseline
  maxReplicas: 5                       # reduced from 8; 5×100m=500m request fits t3.medium
  targetCPUUtilizationPercentage: 50   # lowered from 70% — scale before throttle hits
  targetMemoryUtilizationPercentage: 80

# ============================================================================
# LABELS
# ============================================================================
labels:
  app.kubernetes.io/part-of: llmops-platform
  app.kubernetes.io/component: gateway

# ============================================================================
# ANNOTATIONS
# ============================================================================
podAnnotations:
  prometheus.io/scrape: "false"

# ============================================================================
# SERVICE ACCOUNT — IRSA for Bedrock access
# ============================================================================
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::492372116094:role/llmops-cluster-litellm
