# LiteLLM Helm Values for LLMOps Platform
# Purpose: Unified LLM proxy gateway with observability

# ============================================================================
# IMAGE CONFIGURATION
# ============================================================================
image:
  repository: ghcr.io/berriai/litellm-non_root
  tag: "main-latest"  # Or pin to specific version like "main-v1.0.0"
  pullPolicy: IfNotPresent

# ============================================================================
# DEPLOYMENT
# ============================================================================
replicaCount: 3

# ============================================================================
# RESOURCES
# ============================================================================
resources:
  requests:
    memory: "2Gi"
    cpu: "200m"
  limits:
    memory: "4Gi"
    cpu: "500m"

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
env:
  # Master key for API authentication
  - name: LITELLM_MASTER_KEY
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: LITELLM_MASTER_KEY

  # Salt key for encryption
  - name: LITELLM_SALT_KEY
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: LITELLM_SALT_KEY

  # Database URL for spend tracking and logging
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: llmops-supabase-secret
        key: LITELLM_DB_URL

  # Redis URL for caching
  - name: REDIS_HOST
    value: "redis-master.redis.svc.cluster.local"

  - name: REDIS_PORT
    value: "6379"

  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: REDIS_PASSWORD

  # Langfuse callback configuration
  - name: LANGFUSE_PUBLIC_KEY
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: LANGFUSE_PUBLIC_KEY

  - name: LANGFUSE_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: LANGFUSE_SECRET_KEY

  - name: LANGFUSE_HOST
    value: "http://langfuse.langfuse.svc.cluster.local:3000"

  # Provider API keys
  - name: OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: OPENAI_API_KEY

  - name: ANTHROPIC_API_KEY
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: ANTHROPIC_API_KEY

  - name: GEMINI_API_KEY
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: GEMINI_API_KEY

  # LiteLLM settings
  - name: LITELLM_LOG
    value: "INFO"

  - name: JSON_LOGS
    value: "true"

  # Set writable directory for LiteLLM migrations
  - name: LITELLM_MIGRATION_DIR
    value: "/tmp/litellm-migrations"

# ============================================================================
# LITELLM CONFIG
# ============================================================================
# LiteLLM configuration file (config.yaml)
config:
  model_list:
    # Fast Chat - General internal chat (latency-based load balanced)
    - model_name: fast-chat
      litellm_params:
        model: gemini/gemini-1.5-flash
        api_key: os.environ/GEMINI_API_KEY
      model_info:
        mode: chat
        supports_function_calling: true

    - model_name: fast-chat
      litellm_params:
        model: gpt-4o-mini
        api_key: os.environ/OPENAI_API_KEY
      model_info:
        mode: chat

    - model_name: fast-chat
      litellm_params:
        model: anthropic/claude-haiku-4-20250228
        api_key: os.environ/ANTHROPIC_API_KEY
      model_info:
        mode: chat

    # Coding Assistant - Engineering and code review
    - model_name: coding-assistant
      litellm_params:
        model: gpt-4o
        api_key: os.environ/OPENAI_API_KEY
      model_info:
        mode: chat
        supports_function_calling: true

    - model_name: coding-assistant
      litellm_params:
        model: anthropic/claude-sonnet-4-20250514
        api_key: os.environ/ANTHROPIC_API_KEY
      model_info:
        mode: chat

    - model_name: coding-assistant
      litellm_params:
        model: gemini/gemini-2.0-flash-exp
        api_key: os.environ/GEMINI_API_KEY
      model_info:
        mode: chat

    # Private Chat - Local models via Ollama in K8s (sensitive data)
    - model_name: private-chat
      litellm_params:
        model: ollama/llama3.2
        api_base: http://ollama.ollama.svc.cluster.local:11434
      model_info:
        mode: chat

    - model_name: private-chat
      litellm_params:
        model: ollama/qwen2.5:7b
        api_base: http://ollama.ollama.svc.cluster.local:11434
      model_info:
        mode: chat

    # Long Context - Large document analysis
    - model_name: long-context
      litellm_params:
        model: gemini/gemini-1.5-pro
        api_key: os.environ/GEMINI_API_KEY
      model_info:
        mode: chat
        max_tokens: 2097152

    - model_name: long-context
      litellm_params:
        model: anthropic/claude-sonnet-4-20250514
        api_key: os.environ/ANTHROPIC_API_KEY
      model_info:
        mode: chat
        max_tokens: 200000

    # Fallback Model - Backup when primary aliases fail
    - model_name: fallback-model
      litellm_params:
        model: gemini/gemini-1.5-flash
        api_key: os.environ/GEMINI_API_KEY
      model_info:
        mode: chat

  # Router settings for load balancing and fallbacks
  router_settings:
    routing_strategy: latency-based-routing
    num_retries: 2
    timeout: 60
    fallbacks:
      - fast-chat: [fallback-model]
      - coding-assistant: [fast-chat, fallback-model]
      - long-context: [fast-chat]
    allowed_fails: 3
    cooldown_time: 60

  # Model-specific rate limits and timeouts
  model_settings:
    - model_name: coding-assistant
      litellm_params:
        rpm: 100
        max_tokens: 4096
        temperature: 0.3

    - model_name: long-context
      litellm_params:
        rpm: 20
        timeout: 120

    - model_name: private-chat
      litellm_params:
        rpm: 200
        timeout: 90

  # LiteLLM settings
  litellm_settings:
    # Callbacks for Langfuse observability
    success_callback: ["langfuse", "prometheus"]
    failure_callback: ["langfuse", "prometheus"]

    # Redis caching
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      password: os.environ/REDIS_PASSWORD
      ttl: 3600

    # Logging
    json_logs: true

    # Request handling
    drop_params: true
    max_parallel_requests: 100

  # General settings - budget, rate limits, auth
  general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY
    database_url: os.environ/DATABASE_URL

    # Global rate limits
    rpm: 1000
    tpm: 1000000

    # Budget limits (USD per month, platform-wide)
    budget_duration: 30d
    max_budget: 6000

    # Team-based model restrictions are managed via the LiteLLM admin API.
    # Use POST /team and POST /key with the `models` field to restrict which
    # aliases each team can access. Example team model allowlists:
    #
    # default_team_settings:
    #   - team_alias: engineering
    #     models: [coding-assistant, fast-chat, long-context]
    #   - team_alias: support
    #     models: [fast-chat]
    #   - team_alias: product
    #     models: [fast-chat]
    #   - team_alias: operations
    #     models: [fast-chat]
    #   - team_alias: executives
    #     models: [fast-chat, long-context]
    #
    # Apply via: litellm admin API POST /team/new or PATCH /team
    # with body: {"team_alias": "<name>", "models": ["<alias>", ...]}

# ============================================================================
# SERVICE
# ============================================================================
service:
  type: ClusterIP
  port: 4000
  targetPort: 4000
  annotations: {}

# ============================================================================
# INGRESS
# ============================================================================
ingress:
  enabled: true
  className: alb
  annotations:
    # ALB configuration
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

    # Health check
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"

    # Tags
    alb.ingress.kubernetes.io/tags: "Environment=production,Project=llmops,Component=litellm"

  hosts:
    - host: ""  # Use AWS-provided ALB DNS name
      paths:
        - path: /
          pathType: Prefix

  tls: []

# ============================================================================
# HEALTH CHECKS
# ============================================================================
livenessProbe:
  httpGet:
    path: /health
    port: 4000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 4000
  initialDelaySeconds: 20
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3


# ============================================================================
# SECURITY CONTEXT
# ============================================================================
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

# ============================================================================
# POD DISRUPTION BUDGET
# ============================================================================
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ============================================================================
# AUTOSCALING
# ============================================================================
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ============================================================================
# LABELS
# ============================================================================
labels:
  app.kubernetes.io/part-of: llmops-platform
  app.kubernetes.io/component: gateway

# ============================================================================
# ANNOTATIONS
# ============================================================================
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "4000"
  prometheus.io/path: "/metrics"
