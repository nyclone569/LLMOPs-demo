# Langfuse Helm Values for LLMOps Platform
# Chart: langfuse/langfuse v1.0.0 (Langfuse v3.x)
# Purpose: LLM observability and analytics platform

langfuse:
  # ============================================================================
  # AUTHENTICATION SECRETS
  # ============================================================================
  salt:
    secretKeyRef:
      name: llmops-apikeys-secret
      key: LANGFUSE_SECRET_KEY

  nextauth:
    url: "http://internal-llmops-langfuse-1207825939.ap-southeast-1.elb.amazonaws.com"
    secret:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: LANGFUSE_SECRET_KEY

  # ============================================================================
  # APPLICATION SETTINGS
  # ============================================================================
  features:
    telemetryEnabled: false

  nodeEnv: production

  # ============================================================================
  # ADDITIONAL ENVIRONMENT VARIABLES
  # ============================================================================
  additionalEnv:
    # Public key for API access
    - name: LANGFUSE_PUBLIC_KEY
      valueFrom:
        secretKeyRef:
          name: llmops-apikeys-secret
          key: LANGFUSE_PUBLIC_KEY

    # Enable JSON logging for better observability
    - name: JSON_LOGS
      value: "true"

    - name: LANGFUSE_WORKER_POSTHOG_ENABLED
      value: "false"

    # Single-node ClickHouse: disable ON CLUSTER DDL so migrations use
    # MergeTree (unclustered path) instead of ReplicatedMergeTree.
    # Without this the up.sh entrypoint defaults to clustered mode and
    # the migrate process hangs indefinitely on fresh Keeper initialization.
    - name: CLICKHOUSE_CLUSTER_ENABLED
      value: "false"

    - name: LANGFUSE_S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: llmops-apikeys-secret
          key: LANGFUSE_S3_ACCESS_KEY_ID

    - name: LANGFUSE_S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: llmops-apikeys-secret
          key: LANGFUSE_S3_SECRET_ACCESS_KEY

    # AWS SDK default credential chain reads AWS_ACCESS_KEY_ID/SECRET.
    # Langfuse's S3Client falls back to this chain instead of LANGFUSE_S3_*.
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: llmops-apikeys-secret
          key: LANGFUSE_S3_ACCESS_KEY_ID

    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: llmops-apikeys-secret
          key: LANGFUSE_S3_SECRET_ACCESS_KEY

    - name: AWS_REGION
      value: "ap-southeast-1"

  # ============================================================================
  # RESOURCES
  # ============================================================================
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # ============================================================================
  # REPLICAS — chart key is `replicas` (not `replicaCount`)
  # ============================================================================
  replicas: 2

  # ============================================================================
  # WEB — probes + replicas + HPA all under langfuse.web
  # Langfuse startup: Prisma migration + ClickHouse DDL + Next.js boot takes
  # 60-120s. initialDelaySeconds=150 prevents SIGKILL before app is ready.
  # ============================================================================
  web:
    replicas: 2

    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70

    livenessProbe:
      initialDelaySeconds: 150
      periodSeconds: 15
      failureThreshold: 3
      timeoutSeconds: 5

    readinessProbe:
      initialDelaySeconds: 150
      periodSeconds: 15
      failureThreshold: 3
      timeoutSeconds: 5

  # ============================================================================
  # WORKER — replicas under langfuse.worker (not top-level worker)
  # ============================================================================
  worker:
    replicas: 2
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  # ============================================================================
  # INGRESS
  # ============================================================================
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internal
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
      alb.ingress.kubernetes.io/healthcheck-path: /api/public/health
      alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
      alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
      alb.ingress.kubernetes.io/healthy-threshold-count: "2"
      alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
      alb.ingress.kubernetes.io/tags: "Environment=production,Project=llmops,Component=langfuse,Owner=nghiatd,Cluster=llmops-cluster"
      alb.ingress.kubernetes.io/load-balancer-name: "llmops-langfuse"
    hosts:
      - host: ""  # Use AWS-provided ALB DNS name
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: false

  # ============================================================================
  # POD ANNOTATIONS
  # ============================================================================
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/api/public/metrics"

  # ============================================================================
  # LABELS
  # ============================================================================
  commonLabels:
    app.kubernetes.io/part-of: llmops-platform
    app.kubernetes.io/component: observability

# ============================================================================
# DATABASE — in-cluster PostgreSQL (postgresql namespace)
# ============================================================================
postgresql:
  deploy: false
  host: "postgresql-primary.postgresql.svc.cluster.local"
  port: 5432
  auth:
    username: "postgres"
    existingSecret: "llmops-apikeys-secret"
    secretKeys:
      userPasswordKey: "POSTGRESQL_PASSWORD"
    database: "langfuse"

# ============================================================================
# REDIS — use existing cluster Redis (shared with LiteLLM)
# ============================================================================
redis:
  deploy: false
  host: "redis-master.redis.svc.cluster.local"
  port: 6379
  auth:
    existingSecret: llmops-apikeys-secret
    existingSecretPasswordKey: REDIS_PASSWORD

# ============================================================================
# CLICKHOUSE — standalone deployment (bitnami/clickhouse removed from Docker Hub)
# A separate clickhouse Deployment using clickhouse/clickhouse-server is managed
# as an additional source in the langfuse ArgoCD app (argocd/manifests/clickhouse.yaml)
# ============================================================================
clickhouse:
  deploy: false
  host: "langfuse-clickhouse"
  auth:
    username: "default"
    existingSecret: "llmops-apikeys-secret"
    existingSecretKey: "CLICKHOUSE_PASSWORD"

# ============================================================================
# S3 — bucket name required by Helm chart schema even when not in use.
# No credentials provided — Langfuse will not upload blobs but traces work.
# ============================================================================
s3:
  deploy: false
  bucket: llmops-langfuse-492372116094-ap-southeast-1-an
  region: ap-southeast-1
  forcePathStyle: false
