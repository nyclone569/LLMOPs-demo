# Langfuse Helm Values for LLMOps Platform
# Chart: langfuse/langfuse v1.0.0 (Langfuse v3.x)
# Purpose: LLM observability and analytics platform

langfuse:
  # ============================================================================
  # AUTHENTICATION SECRETS
  # ============================================================================
  salt:
    secretKeyRef:
      name: llmops-apikeys-secret
      key: LANGFUSE_SECRET_KEY

  nextauth:
    url: "http://localhost:3000"  # Update to ALB DNS name after first deploy
    secret:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: LANGFUSE_SECRET_KEY

  # ============================================================================
  # APPLICATION SETTINGS
  # ============================================================================
  features:
    telemetryEnabled: false

  nodeEnv: production

  # ============================================================================
  # ADDITIONAL ENVIRONMENT VARIABLES
  # ============================================================================
  additionalEnv:
    # Database connection from Supabase cloud PostgreSQL
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: llmops-supabase-secret
          key: LANGFUSE_DB_URL

    - name: DIRECT_URL
      valueFrom:
        secretKeyRef:
          name: llmops-supabase-secret
          key: LANGFUSE_DB_URL

    # Public key for API access
    - name: LANGFUSE_PUBLIC_KEY
      valueFrom:
        secretKeyRef:
          name: llmops-apikeys-secret
          key: LANGFUSE_PUBLIC_KEY

    # Enable JSON logging for better observability
    - name: JSON_LOGS
      value: "true"

  # ============================================================================
  # RESOURCES
  # ============================================================================
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # ============================================================================
  # INGRESS
  # ============================================================================
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internal
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
      alb.ingress.kubernetes.io/healthcheck-path: /api/public/health
      alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
      alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
      alb.ingress.kubernetes.io/healthy-threshold-count: "2"
      alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
      alb.ingress.kubernetes.io/tags: "Environment=production,Project=llmops,Component=langfuse"
    hosts:
      - host: ""  # Use AWS-provided ALB DNS name
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: false

  # ============================================================================
  # DEPLOYMENT
  # ============================================================================
  replicaCount: 2

  # ============================================================================
  # AUTOSCALING
  # ============================================================================
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # ============================================================================
  # POD ANNOTATIONS
  # ============================================================================
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/api/public/metrics"

  # ============================================================================
  # LABELS
  # ============================================================================
  commonLabels:
    app.kubernetes.io/part-of: llmops-platform
    app.kubernetes.io/component: observability

# ============================================================================
# DATABASE — use Supabase cloud PostgreSQL, disable built-in
# ============================================================================
postgresql:
  deploy: false

# ============================================================================
# REDIS — use existing cluster Redis (shared with LiteLLM)
# ============================================================================
redis:
  deploy: false
  host: "redis-master.redis.svc.cluster.local"
  port: 6379
  auth:
    existingSecret: llmops-apikeys-secret
    existingSecretPasswordKey: REDIS_PASSWORD

# ============================================================================
# CLICKHOUSE — deploy bundled ClickHouse with secret-backed password
# ============================================================================
clickhouse:
  deploy: true
  image:
    tag: "24.8.10.22-debian-12-r0"
  auth:
    existingSecret: llmops-apikeys-secret
    existingSecretKey: CLICKHOUSE_PASSWORD

# ============================================================================
# S3 — use AWS S3, disable bundled MinIO
# ============================================================================
s3:
  deploy: false
  bucket: llmops-langfuse
  region: ap-southeast-1
  forcePathStyle: false
  accessKeyId:
    secretKeyRef:
      name: llmops-apikeys-secret
      key: LANGFUSE_S3_ACCESS_KEY_ID
  secretAccessKey:
    secretKeyRef:
      name: llmops-apikeys-secret
      key: LANGFUSE_S3_SECRET_ACCESS_KEY
