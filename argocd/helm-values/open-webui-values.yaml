# Open WebUI Helm Values for LLMOps Platform
# Chart: open-webui/open-webui (v14.6.0)
# Purpose: Chat interface for LLM interactions
# Updated to match chart v14.x schema

# ============================================================================
# IMAGE CONFIGURATION
# ============================================================================
image:
  repository: ghcr.io/open-webui/open-webui
  tag: ""  # Uses chart default (appVersion 0.9.5)
  pullPolicy: IfNotPresent

# ============================================================================
# REPLICA COUNT
# ============================================================================
replicaCount: 2

# ============================================================================
# RESOURCES
# ============================================================================
resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# ============================================================================
# OLLAMA CONFIGURATION
# ============================================================================
# Disable built-in Ollama (we're using LiteLLM proxy instead)
ollama:
  enabled: false

# External Ollama URLs (pointing to LiteLLM proxy which handles routing)
ollamaUrls: []

# ============================================================================
# PIPELINES
# ============================================================================
# Disable pipelines subchart (adds complexity, not needed for basic webui)
pipelines:
  enabled: false

# ============================================================================
# WEBSOCKET
# ============================================================================
# Disable websocket subchart (LiteLLM handles WebSocket via its own config)
websocket:
  enabled: false

# ============================================================================
# OPENAI API CONFIGURATION
# ============================================================================
# Enable OpenAI API integration (LiteLLM speaks OpenAI-compatible API)
enableOpenaiApi: true

# Point Open WebUI at LiteLLM proxy
openaiBaseApiUrl: "http://litellm.litellm.svc.cluster.local:4000/v1"

# OpenAI API key from existing Kubernetes secret
openaiApiKeyExistingSecret: "llmops-apikeys-secret"
openaiApiKeyExistingSecretKey: "LITELLM_MASTER_KEY"

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
extraEnvVars:
  # WebUI session secret
  - name: WEBUI_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: WEBUI_SECRET_KEY

  # Application settings
  - name: WEBUI_NAME
    value: "LLMOps Chat"

  - name: ENABLE_SIGNUP
    value: "true"

  - name: DEFAULT_USER_ROLE
    value: "user"

  # Logging
  - name: WEBUI_LOG_LEVEL
    value: "INFO"

# ============================================================================
# PERSISTENCE
# ============================================================================
persistence:
  enabled: true
  size: 5Gi
  storageClass: "gp3"
  accessModes:
    - ReadWriteOnce
  # Data stored at /app/backend/data inside the container

# ============================================================================
# SERVICE
# ============================================================================
service:
  type: ClusterIP
  annotations: {}
  port: 80
  containerPort: 8080
  labels: {}

# ============================================================================
# INGRESS
# ============================================================================
ingress:
  enabled: true
  class: alb
  annotations:
    # ALB configuration
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"

    # Health check
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"

    # Security - UPDATE security group ID
    alb.ingress.kubernetes.io/security-groups: "sg-xxxxx"

    # Tags
    alb.ingress.kubernetes.io/tags: "Environment=production,Project=llmops,Component=open-webui"

  host: chat.internal.yourdomain.com

  # TLS: set to true when certificate secret is ready
  tls: false
  existingSecret: "open-webui-tls"

# ============================================================================
# HEALTH CHECKS (v14.6.0 schema)
# ============================================================================
# Open WebUI's Python startup (langchain + sqlalchemy imports, alembic
# migrations, then uvicorn bind) takes 60-120s. A startupProbe defers
# liveness/readiness until the app is actually up, preventing SIGKILL
# during boot. Without this, the default 30s liveness window kills the
# container before it can listen on port 8080.
startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 30   # 30 * 10s = 5 minute startup budget
  periodSeconds: 10
  timeoutSeconds: 5

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  failureThreshold: 3
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  failureThreshold: 3
  periodSeconds: 5
  timeoutSeconds: 3

# ============================================================================
# SECURITY CONTEXT (v14.6.0 uses containerSecurityContext)
# ============================================================================
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1000

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# ============================================================================
# LABELS
# ============================================================================
extraLabels:
  app.kubernetes.io/part-of: llmops-platform
  app.kubernetes.io/component: frontend

# ============================================================================
# ANNOTATIONS
# ============================================================================
podAnnotations:
  prometheus.io/scrape: "false"