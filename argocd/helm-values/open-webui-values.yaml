# Open WebUI Helm Values for LLMOps Platform
# Chart: open-webui/open-webui (v14.6.0)
# Purpose: Chat interface for LLM interactions
# Updated to match chart v14.x schema

# ============================================================================
# IMAGE CONFIGURATION
# ============================================================================
image:
  repository: ghcr.io/open-webui/open-webui
  tag: ""  # Uses chart default (appVersion 0.9.5)
  pullPolicy: IfNotPresent

# ============================================================================
# REPLICA COUNT
# ============================================================================
replicaCount: 2

# ============================================================================
# AUTOSCALING (HPA)
# ============================================================================
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ============================================================================
# RESOURCES
# ============================================================================
resources:
  requests:
    memory: "1Gi"
    cpu: "100m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

# ============================================================================
# OLLAMA CONFIGURATION
# ============================================================================
# Disable built-in Ollama (we're using LiteLLM proxy instead)
ollama:
  enabled: false

# External Ollama URLs (pointing to LiteLLM proxy which handles routing)
ollamaUrls: []

# ============================================================================
# PIPELINES
# ============================================================================
# Disable pipelines subchart (adds complexity, not needed for basic webui)
pipelines:
  enabled: false

# ============================================================================
# WEBSOCKET
# ============================================================================
# Disable websocket subchart (LiteLLM handles WebSocket via its own config)
websocket:
  enabled: false

# ============================================================================
# OPENAI API CONFIGURATION
# ============================================================================
# Enable OpenAI API integration (LiteLLM speaks OpenAI-compatible API)
enableOpenaiApi: true

# Point Open WebUI at LiteLLM proxy
openaiBaseApiUrl: "http://litellm.litellm.svc.cluster.local:4000/v1"

# OpenAI API key from existing Kubernetes secret
openaiApiKeyExistingSecret: "llmops-apikeys-secret"
openaiApiKeyExistingSecretKey: "LITELLM_MASTER_KEY"

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
extraEnvVars:
  # WEBUI_URL must match the host the browser uses, because Open WebUI
  # builds the OAuth redirect_uri from this value. Internal ALB is not
  # reachable from outside the VPC, so during port-forward testing
  # (kubectl port-forward 8080:80) override to localhost:8080 here and
  # add the same redirect URI in Google Cloud Console. When a real
  # custom domain / VPN entry exists, set this to the canonical host.
  - name: WEBUI_URL
    value: "http://localhost:8080"

  # WebUI session secret
  - name: WEBUI_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: WEBUI_SECRET_KEY

  # Application settings
  - name: WEBUI_NAME
    value: "LLMOps Chat"

  - name: ENABLE_SIGNUP
    value: "true"

  - name: DEFAULT_USER_ROLE
    value: "user"

  # Logging
  - name: WEBUI_LOG_LEVEL
    value: "INFO"

  # Allow Functions to import packages installed by the init container
  - name: PYTHONPATH
    value: "/app/backend/data/pip-packages"

  # SSO/OIDC Configuration — Google Workspace
  #
  # Provider URL is hard-coded to Google's discovery endpoint; only the
  # client_id / client_secret come from Secrets Manager. To enable:
  #   1. Google Cloud Console → APIs & Services → Credentials → Create
  #      OAuth client ID (Web application).
  #   2. Authorized redirect URI:
  #        http://internal-llmops-open-webui-54615089.ap-southeast-1.elb.amazonaws.com/oauth/oidc/callback
  #      (replace host once a custom domain / HTTPS is in front of the ALB)
  #   3. Add OIDC_CLIENT_ID and OIDC_CLIENT_SECRET to AWS Secrets Manager
  #      entry llmops/apikeys.
  #   4. Force ExternalSecret refresh + rollout open-webui — see RUNBOOK §5.3.
  - name: ENABLE_OAUTH_SIGNUP
    value: "true"

  - name: OAUTH_PROVIDER_NAME
    value: "Google"

  - name: OPENID_PROVIDER_URL
    value: "https://accounts.google.com/.well-known/openid-configuration"

  - name: OAUTH_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: OIDC_CLIENT_ID
        optional: true

  - name: OAUTH_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: llmops-apikeys-secret
        key: OIDC_CLIENT_SECRET
        optional: true

  - name: OAUTH_SCOPES
    value: "openid email profile"

  - name: ENABLE_LOGIN_FORM
    value: "true"

# ============================================================================
# PERSISTENCE
# ============================================================================
persistence:
  enabled: true
  size: 5Gi
  storageClass: "gp3"
  accessModes:
    - ReadWriteOnce
  # Data stored at /app/backend/data inside the container

# ============================================================================
# SERVICE
# ============================================================================
service:
  type: ClusterIP
  annotations: {}
  port: 80
  containerPort: 8080
  labels: {}

# ============================================================================
# INGRESS
# ============================================================================
ingress:
  enabled: true
  class: alb
  annotations:
    # ALB configuration
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.type=lb_cookie,stickiness.lb_cookie.duration_seconds=86400

    # Health check
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"

    # Tags
    alb.ingress.kubernetes.io/tags: "Environment=production,Project=llmops,Component=open-webui,Owner=nghiatd,Cluster=llmops-cluster"
    alb.ingress.kubernetes.io/load-balancer-name: "llmops-open-webui"

  host: ""  # Use AWS-provided ALB DNS name

  tls: false

# ============================================================================
# HEALTH CHECKS (v14.6.0 schema)
# ============================================================================
# Open WebUI's Python startup (langchain + sqlalchemy imports, alembic
# migrations, then uvicorn bind) takes 60-120s. A startupProbe defers
# liveness/readiness until the app is actually up, preventing SIGKILL
# during boot. Without this, the default 30s liveness window kills the
# container before it can listen on port 8080.
startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 30   # 30 * 10s = 5 minute startup budget
  periodSeconds: 10
  timeoutSeconds: 5

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  failureThreshold: 3
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  failureThreshold: 3
  periodSeconds: 5
  timeoutSeconds: 3

# ============================================================================
# SECURITY CONTEXT (v14.6.0 uses containerSecurityContext)
# ============================================================================
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1000

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# ============================================================================
# EXTRA PACKAGES
# Installs pip packages needed by Open WebUI Functions into the persistent data
# volume (/app/backend/data/pip-packages) as UID 1000 (non-root). PYTHONPATH
# is set so the main container can import them. Uses the same image as the main
# container to guarantee ABI compatibility for C extensions (duckdb .so).
# Skips install if the package directory already exists to avoid re-downloading
# on every pod restart.
# ============================================================================
extraInitContainers:
  - name: install-pip-packages
    image: ghcr.io/open-webui/open-webui:v0.9.5
    command:
      - sh
      - -c
      - test -d /app/backend/data/pip-packages/duckdb || pip install --target /app/backend/data/pip-packages duckdb==1.2.2
    securityContext:
      runAsUser: 1000
      runAsNonRoot: true
    volumeMounts:
      - name: data
        mountPath: /app/backend/data

# ============================================================================
# LABELS
# ============================================================================
extraLabels:
  app.kubernetes.io/part-of: llmops-platform
  app.kubernetes.io/component: frontend

# ============================================================================
# ANNOTATIONS
# ============================================================================
podAnnotations:
  prometheus.io/scrape: "false"