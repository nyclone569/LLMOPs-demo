apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-simulator-script
  namespace: litellm
data:
  simulator.py: |
    #!/usr/bin/env python3
    """
    LLMOps Traffic Simulator
    Simulates 290 users across 5 teams sending requests to LiteLLM.
    
    Requirements §6 / §10:
      - 290 simulated users, 5 teams
      - 100 req/min base, 1000 req/min burst (10:00-10:30, 15:00-15:20)
      - 5% long-context, 2% duplicate prompts, 3% provider failure simulation
      - 1% sensitive prompt injection, 15% expensive-model requests
    """
    
    import os
    import random
    import time
    import logging
    import threading
    import itertools
    from datetime import datetime, timezone
    from typing import Optional
    
    import requests
    
    logging.basicConfig(
        level=logging.INFO,
        format="%(asctime)s %(levelname)s %(message)s",
    )
    log = logging.getLogger(__name__)
    
    # ── Configuration ──────────────────────────────────────────────────────────────
    LITELLM_BASE_URL = os.environ.get("LITELLM_BASE_URL", "http://litellm.litellm.svc.cluster.local:4000")
    LITELLM_API_KEY  = os.environ.get("LITELLM_API_KEY", "sk-1234")
    
    TOTAL_USERS      = int(os.environ.get("TOTAL_USERS", "290"))
    BASE_RPM         = int(os.environ.get("BASE_RPM", "100"))
    BURST_RPM        = int(os.environ.get("BURST_RPM", "1000"))
    RUN_DURATION_S   = int(os.environ.get("RUN_DURATION_S", "3600"))  # 1 hour default
    
    LONG_CONTEXT_RATE    = float(os.environ.get("LONG_CONTEXT_RATE", "0.05"))
    DUPLICATE_RATE       = float(os.environ.get("DUPLICATE_RATE", "0.02"))
    PROVIDER_FAIL_RATE   = float(os.environ.get("PROVIDER_FAIL_RATE", "0.03"))
    SENSITIVE_RATE       = float(os.environ.get("SENSITIVE_RATE", "0.01"))
    EXPENSIVE_RATE       = float(os.environ.get("EXPENSIVE_RATE", "0.15"))
    
    # Burst windows (UTC hour ranges)
    BURST_WINDOWS = [
        (2, 30),   # 10:00-10:30 SGT = 02:00-02:30 UTC
        (7, 20),   # 15:00-15:20 SGT = 07:00-07:20 UTC
    ]
    
    # ── Teams & model access ───────────────────────────────────────────────────────
    TEAMS = {
        "engineering": {
            "models": ["coding-assistant", "fast-chat", "long-context"],
            "weight": 100,
        },
        "product": {
            "models": ["fast-chat"],
            "weight": 60,
        },
        "support": {
            "models": ["fast-chat"],
            "weight": 80,
        },
        "operations": {
            "models": ["fast-chat"],
            "weight": 30,
        },
        "executives": {
            "models": ["fast-chat", "long-context"],
            "weight": 20,
        },
    }
    
    # ── Prompt libraries ───────────────────────────────────────────────────────────
    NORMAL_PROMPTS = [
        "Summarize the key points from last week's sprint retrospective.",
        "Write a Python function to parse a JSON config file.",
        "What are best practices for Kubernetes resource limits?",
        "Draft an email to the product team about the API v2 launch.",
        "Explain the difference between Redis sorted sets and regular sets.",
        "Help me write a SQL query to find the top 10 customers by revenue.",
        "Review this code snippet and suggest improvements: def foo(x): return x*2",
        "What is the recommended pattern for handling secrets in Kubernetes?",
        "Translate the following user story into acceptance criteria.",
        "Explain how LLM token pricing works.",
        "Write unit tests for a REST API endpoint that creates a user.",
        "What are the trade-offs between gRPC and REST for internal services?",
        "Help me debug this error: connection refused on port 5432.",
        "Create a Grafana dashboard JSON for tracking API error rates.",
        "Summarize the differences between GPT-4o and Claude 3.5 Sonnet.",
        "How do I set up Prometheus alerting rules in kube-prometheus-stack?",
        "Write a shell script to rotate Kubernetes secrets.",
        "What is the purpose of a sidecar container in Kubernetes?",
        "Help me optimize this database query for better performance.",
        "Explain the CAP theorem with a practical example.",
    ]
    
    LONG_CONTEXT_PROMPTS = [
        "Read the following 50-page technical specification and extract all API endpoints: " + "X" * 8000,
        "Summarize the following transcript from a 2-hour meeting: " + "discussion " * 2000,
        "Review the following codebase and identify security vulnerabilities: " + "def process(): pass\n" * 500,
    ]
    
    SENSITIVE_PROMPTS = [
        "My AWS access key is AKIAIOSFODNN7EXAMPLE and secret is wJalrXUtnFEMI/K7MDENG. Help me.",
        "Connect to database postgresql://admin:SuperSecret123@prod-db:5432/users",
        "Here is my credit card: 4532015112830366 exp 12/26 CVV 123. Process payment.",
        "Employee SSN 123-45-6789 salary is $150,000, please keep confidential.",
        "API token: sk-proj-abcdef123456 please use this to call the service.",
    ]
    
    DUPLICATE_PROMPT = "What is the capital of France?"
    
    # ── User pool ──────────────────────────────────────────────────────────────────
    def build_users() -> list[dict]:
        users = []
        team_list = list(TEAMS.keys())
        weights   = [TEAMS[t]["weight"] for t in team_list]
        total_w   = sum(weights)
        allocated = 0
    
        for i, team in enumerate(team_list):
            count = round(TOTAL_USERS * weights[i] / total_w)
            if i == len(team_list) - 1:
                count = TOTAL_USERS - allocated
            allocated += count
            for j in range(count):
                users.append({
                    "id":   f"{team}-user-{j:03d}",
                    "team": team,
                })
        return users
    
    USERS = build_users()
    
    # ── Helpers ────────────────────────────────────────────────────────────────────
    def is_burst_window() -> bool:
        now = datetime.now(timezone.utc)
        minute_of_day = now.hour * 60 + now.minute
        for start_h, duration_m in BURST_WINDOWS:
            start_m = start_h * 60
            if start_m <= minute_of_day < start_m + duration_m:
                return True
        return False
    
    
    def pick_model(user: dict) -> str:
        allowed = TEAMS[user["team"]]["models"]
    
        r = random.random()
        if r < EXPENSIVE_RATE and "coding-assistant" in allowed:
            return "coding-assistant"
        if r < EXPENSIVE_RATE + LONG_CONTEXT_RATE and "long-context" in allowed:
            return "long-context"
        return random.choice(allowed)
    
    
    def pick_prompt() -> str:
        r = random.random()
        if r < SENSITIVE_RATE:
            return random.choice(SENSITIVE_PROMPTS)
        if r < SENSITIVE_RATE + DUPLICATE_RATE:
            return DUPLICATE_PROMPT
        if r < SENSITIVE_RATE + DUPLICATE_RATE + LONG_CONTEXT_RATE:
            return random.choice(LONG_CONTEXT_PROMPTS)
        return random.choice(NORMAL_PROMPTS)
    
    
    def send_request(user: dict, session: requests.Session) -> Optional[dict]:
        model  = pick_model(user)
        prompt = pick_prompt()
    
        # Simulate provider failure: send to a non-existent model occasionally
        if random.random() < PROVIDER_FAIL_RATE:
            model = "nonexistent-model-failure-test"
    
        payload = {
            "model": model,
            "messages": [{"role": "user", "content": prompt}],
            "max_tokens": 200,
            "user": user["id"],
            "metadata": {"team": user["team"]},
        }
        headers = {
            "Authorization": f"Bearer {LITELLM_API_KEY}",
            "Content-Type":  "application/json",
        }
    
        try:
            t0 = time.monotonic()
            resp = session.post(
                f"{LITELLM_BASE_URL}/chat/completions",
                json=payload,
                headers=headers,
                timeout=60,
            )
            latency = time.monotonic() - t0
    
            if resp.status_code == 200:
                log.info("OK model=%s user=%s latency=%.2fs", model, user["id"], latency)
            else:
                log.warning("ERR model=%s user=%s status=%d body=%s",
                            model, user["id"], resp.status_code, resp.text[:200])
            return {"status": resp.status_code, "latency": latency, "model": model}
    
        except requests.exceptions.Timeout:
            log.warning("TIMEOUT model=%s user=%s", model, user["id"])
            return {"status": 0, "latency": 60.0, "model": model, "error": "timeout"}
        except Exception as exc:
            log.error("EXCEPTION model=%s user=%s err=%s", model, user["id"], exc)
            return {"status": 0, "latency": 0.0, "model": model, "error": str(exc)}
    
    
    # ── Main loop ──────────────────────────────────────────────────────────────────
    def run_simulation():
        session     = requests.Session()
        user_cycle  = itertools.cycle(USERS)
        start_time  = time.monotonic()
        req_count   = 0
        err_count   = 0
    
        log.info("Starting simulation: %d users, %d base RPM, %d burst RPM, %ds duration",
                 TOTAL_USERS, BASE_RPM, BURST_RPM, RUN_DURATION_S)
    
        while time.monotonic() - start_time < RUN_DURATION_S:
            rpm        = BURST_RPM if is_burst_window() else BASE_RPM
            interval_s = 60.0 / rpm
    
            user   = next(user_cycle)
            result = send_request(user, session)
    
            req_count += 1
            if result and result.get("status", 0) not in (200, 201):
                err_count += 1
    
            if req_count % 100 == 0:
                elapsed = time.monotonic() - start_time
                log.info("STATS requests=%d errors=%d error_rate=%.1f%% elapsed=%.0fs",
                         req_count, err_count,
                         100.0 * err_count / req_count if req_count else 0,
                         elapsed)
    
            time.sleep(max(0, interval_s))
    
        log.info("Simulation complete: %d requests, %d errors (%.1f%%)",
                 req_count, err_count,
                 100.0 * err_count / req_count if req_count else 0)
    
    
    if __name__ == "__main__":
        run_simulation()
