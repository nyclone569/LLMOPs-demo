apiVersion: batch/v1
kind: CronJob
metadata:
  name: traffic-simulator
  namespace: litellm
  labels:
    app.kubernetes.io/name: traffic-simulator
    app.kubernetes.io/part-of: llmops-platform
spec:
  # Run every hour; each run lasts 55 minutes (RUN_DURATION_S=3300)
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: traffic-simulator
        spec:
          restartPolicy: Never
          serviceAccountName: default
          containers:
            - name: simulator
              image: python:3.12-slim
              command:
                - /bin/sh
                - -c
                - |
                  pip install requests --quiet &&
                  python /app/simulator.py
              env:
                - name: LITELLM_BASE_URL
                  value: "http://litellm.litellm.svc.cluster.local:4000"
                - name: LITELLM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: litellm-env
                      key: LITELLM_MASTER_KEY
                      optional: true
                - name: TOTAL_USERS
                  value: "290"
                - name: BASE_RPM
                  value: "100"
                - name: BURST_RPM
                  value: "1000"
                - name: RUN_DURATION_S
                  value: "3300"
                - name: LONG_CONTEXT_RATE
                  value: "0.05"
                - name: DUPLICATE_RATE
                  value: "0.02"
                - name: PROVIDER_FAIL_RATE
                  value: "0.03"
                - name: SENSITIVE_RATE
                  value: "0.01"
                - name: EXPENSIVE_RATE
                  value: "0.15"
              volumeMounts:
                - name: script
                  mountPath: /app
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
          volumes:
            - name: script
              configMap:
                name: traffic-simulator-script
                defaultMode: 0755
---
# One-shot Job for immediate on-demand runs
apiVersion: batch/v1
kind: Job
metadata:
  name: traffic-simulator-oneshot
  namespace: litellm
  labels:
    app.kubernetes.io/name: traffic-simulator
    app.kubernetes.io/part-of: llmops-platform
  annotations:
    argocd.argoproj.io/hook: Skip
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-simulator
    spec:
      restartPolicy: Never
      containers:
        - name: simulator
          image: python:3.12-slim
          command:
            - /bin/sh
            - -c
            - |
              pip install requests --quiet &&
              python /app/simulator.py
          env:
            - name: LITELLM_BASE_URL
              value: "http://litellm.litellm.svc.cluster.local:4000"
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-env
                  key: LITELLM_MASTER_KEY
                  optional: true
            - name: TOTAL_USERS
              value: "290"
            - name: BASE_RPM
              value: "20"
            - name: BURST_RPM
              value: "100"
            - name: RUN_DURATION_S
              value: "300"
          volumeMounts:
            - name: script
              mountPath: /app
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: script
          configMap:
            name: traffic-simulator-script
            defaultMode: 0755
