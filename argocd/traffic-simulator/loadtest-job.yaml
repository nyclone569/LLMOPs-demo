apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-loadtest-manual
  namespace: litellm
  labels:
    app.kubernetes.io/name: traffic-simulator
    app.kubernetes.io/part-of: llmops-platform
    app.kubernetes.io/component: manual-load-test
  annotations:
    argocd.argoproj.io/hook: Skip
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1500
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-simulator
        app.kubernetes.io/component: manual-load-test
    spec:
      restartPolicy: Never
      containers:
        - name: simulator
          image: python:3.12-slim
          command:
            - /bin/sh
            - -c
            - |
              pip install requests --quiet &&
              python /app/simulator.py
          env:
            - name: LITELLM_BASE_URL
              value: "http://litellm.litellm.svc.cluster.local:4000"
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llmops-apikeys-secret
                  key: LITELLM_MASTER_KEY
                  optional: false
            - name: TOTAL_USERS
              value: "290"
            - name: TARGET_RPM
              value: "20"
            - name: CONCURRENCY
              value: "10"
            - name: RUN_DURATION_S
              value: "300"
            - name: RAMP_UP_S
              value: "60"
            - name: MODEL_MIX
              value: "gpt-4o-mini=1"
            - name: EXPENSIVE_MODEL
              value: "gpt-4o-mini"
            - name: LONG_CONTEXT_RATE
              value: "0.05"
            - name: DUPLICATE_RATE
              value: "0.02"
            - name: PROVIDER_FAIL_RATE
              value: "0.03"
            - name: EXPENSIVE_RATE
              value: "0.15"
            - name: SENSITIVE_RATE
              value: "0.01"
            - name: REQUEST_TIMEOUT_S
              value: "60"
            - name: STATS_INTERVAL_S
              value: "30"
          volumeMounts:
            - name: script
              mountPath: /app
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      volumes:
        - name: script
          configMap:
            name: traffic-simulator-script
            defaultMode: 0755
