apiVersion: v1
kind: ConfigMap
metadata:
  name: llmops-grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  llmops-overview.json: |
    {
      "id": null,
      "uid": "llmops-overview",
      "title": "LLMOps Platform Overview",
      "tags": ["llmops", "overview"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 2,
      "refresh": "30s",
      "time": {"from": "now-3h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Firing Alerts",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "count(ALERTS{alertstate=\"firing\"}) or vector(0)",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "background"
          }
        },
        {
          "id": 2,
          "title": "Request Rate",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 4, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(litellm_deployment_total_requests_total[5m]))",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "reqps"}
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]}
          }
        },
        {
          "id": 3,
          "title": "Error Rate",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 8, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(litellm_deployment_failure_responses_total[5m])) / sum(rate(litellm_deployment_total_requests_total[5m]))",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 0.01},
                  {"color": "red", "value": 0.05}
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "background"
          }
        },
        {
          "id": 4,
          "title": "P95 Latency",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(litellm_request_total_latency_metric_bucket[5m])) by (le))",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "red", "value": 3}
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "background"
          }
        },
        {
          "id": 5,
          "title": "Daily Cost (USD)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 16, "y": 0},
          "targets": [
            {
              "expr": "sum(increase(litellm_spend_metric_total[24h]))",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2
            }
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]}
          }
        },
        {
          "id": 6,
          "title": "Daily Tokens",
          "type": "stat",
          "gridPos": {"h": 4, "w": 4, "x": 20, "y": 0},
          "targets": [
            {
              "expr": "sum(increase(litellm_total_tokens_metric_total[24h]))",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "short"}
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]}
          }
        },
        {
          "id": 7,
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [
            {
              "expr": "sum(rate(litellm_deployment_total_requests_total[5m]))",
              "legendFormat": "Total req/s"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "reqps"}
          }
        },
        {
          "id": 8,
          "title": "Requests by Model",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [
            {
              "expr": "sum(rate(litellm_deployment_total_requests_total[5m])) by (litellm_model_name)",
              "legendFormat": "{{ litellm_model_name }}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "reqps"}
          }
        },
        {
          "id": 9,
          "title": "Error Rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [
            {
              "expr": "sum(rate(litellm_deployment_failure_responses_total[5m])) / sum(rate(litellm_deployment_total_requests_total[5m]))",
              "legendFormat": "Error Rate"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "percentunit", "min": 0, "max": 1}
          }
        },
        {
          "id": 10,
          "title": "Provider Success Rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [
            {
              "expr": "sum(rate(litellm_deployment_success_responses_total[5m])) by (api_provider) / sum(rate(litellm_deployment_total_requests_total[5m])) by (api_provider)",
              "legendFormat": "{{ api_provider }}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "percentunit", "min": 0, "max": 1}
          }
        },
        {
          "id": 11,
          "title": "P50 / P95 Latency",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(litellm_request_total_latency_metric_bucket[5m])) by (le))",
              "legendFormat": "P50"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(litellm_request_total_latency_metric_bucket[5m])) by (le))",
              "legendFormat": "P95"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "s"}
          }
        },
        {
          "id": 12,
          "title": "Latency by Provider (P95)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(litellm_request_total_latency_metric_bucket[5m])) by (le, api_provider))",
              "legendFormat": "{{ api_provider }}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "s"}
          }
        },
        {
          "id": 13,
          "title": "Infrastructure",
          "type": "row",
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 28},
          "collapsed": true,
          "panels": [
            {
              "id": 14,
              "title": "Open WebUI Ready Pods",
              "type": "stat",
              "gridPos": {"h": 4, "w": 6, "x": 0, "y": 29},
              "targets": [
                {
                  "expr": "sum(kube_pod_status_ready{namespace=\"open-webui\",condition=\"true\"})",
                  "legendFormat": ""
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {"color": "red", "value": null},
                      {"color": "green", "value": 1}
                    ]
                  }
                }
              },
              "options": {
                "reduceOptions": {"calcs": ["lastNotNull"]},
                "colorMode": "background"
              }
            },
            {
              "id": 15,
              "title": "Langfuse Ready Pods",
              "type": "stat",
              "gridPos": {"h": 4, "w": 6, "x": 6, "y": 29},
              "targets": [
                {
                  "expr": "sum(kube_pod_status_ready{namespace=\"langfuse\",condition=\"true\"})",
                  "legendFormat": ""
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {"color": "red", "value": null},
                      {"color": "green", "value": 1}
                    ]
                  }
                }
              },
              "options": {
                "reduceOptions": {"calcs": ["lastNotNull"]},
                "colorMode": "background"
              }
            },
            {
              "id": 16,
              "title": "Langfuse Queue Depth",
              "type": "stat",
              "gridPos": {"h": 4, "w": 6, "x": 0, "y": 33},
              "targets": [
                {
                  "expr": "sum(redis_key_size{key=~\"bull:langfuse-new-events:.*\"})",
                  "legendFormat": ""
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {"color": "green", "value": null},
                      {"color": "yellow", "value": 100},
                      {"color": "red", "value": 500}
                    ]
                  }
                }
              },
              "options": {
                "reduceOptions": {"calcs": ["lastNotNull"]},
                "colorMode": "background"
              }
            },
            {
              "id": 17,
              "title": "PostgreSQL Connection Usage",
              "type": "gauge",
              "gridPos": {"h": 4, "w": 6, "x": 6, "y": 33},
              "targets": [
                {
                  "expr": "sum(pg_stat_activity_count) / sum(pg_settings_max_connections)",
                  "legendFormat": ""
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "min": 0,
                  "max": 1,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {"color": "green", "value": null},
                      {"color": "yellow", "value": 0.6},
                      {"color": "red", "value": 0.8}
                    ]
                  }
                }
              }
            },
            {
              "id": 18,
              "title": "Pod CPU Usage",
              "type": "timeseries",
              "gridPos": {"h": 8, "w": 12, "x": 12, "y": 29},
              "targets": [
                {
                  "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"litellm|langfuse|open-webui\",container!=\"\"}[5m])) by (namespace, pod)",
                  "legendFormat": "{{ namespace }}/{{ pod }}"
                }
              ],
              "fieldConfig": {
                "defaults": {"unit": "cores"}
              }
            }
          ]
        }
      ]
    }

  llmops-cost-analysis.json: |
    {
      "id": null,
      "uid": "llmops-cost",
      "title": "LLMOps Cost Analysis",
      "tags": ["llmops", "cost"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "5m",
      "time": {"from": "now-24h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Cost by Model (24h)",
          "type": "piechart",
          "gridPos": {"h": 10, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(increase(litellm_spend_metric_total[24h])) by (litellm_model_name)",
              "legendFormat": "{{ litellm_model_name }}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "currencyUSD"}
          }
        },
        {
          "id": 2,
          "title": "Cost by Team (24h)",
          "type": "piechart",
          "gridPos": {"h": 10, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum(increase(litellm_spend_metric_total[24h])) by (team_alias)",
              "legendFormat": "{{ team_alias }}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "currencyUSD"}
          }
        },
        {
          "id": 3,
          "title": "Top 10 Users by Cost (24h)",
          "type": "barchart",
          "gridPos": {"h": 10, "w": 12, "x": 0, "y": 10},
          "targets": [
            {
              "expr": "topk(10, sum(increase(litellm_spend_metric_total[24h])) by (user))",
              "legendFormat": "{{ user }}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "currencyUSD"}
          }
        },
        {
          "id": 4,
          "title": "Token Usage by Model (24h)",
          "type": "barchart",
          "gridPos": {"h": 10, "w": 12, "x": 12, "y": 10},
          "targets": [
            {
              "expr": "sum(increase(litellm_total_tokens_metric_total[24h])) by (litellm_model_name)",
              "legendFormat": "{{ litellm_model_name }}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "short"}
          }
        },
        {
          "id": 5,
          "title": "Daily Cost Trend (7d)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 16, "x": 0, "y": 20},
          "targets": [
            {
              "expr": "sum(increase(litellm_spend_metric_total[24h]))",
              "legendFormat": "Daily Cost"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "currencyUSD"}
          }
        },
        {
          "id": 6,
          "title": "Budget Utilization",
          "type": "gauge",
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 20},
          "targets": [
            {
              "expr": "sum(increase(litellm_spend_metric_total[24h])) / 200",
              "legendFormat": "% of $200 budget"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 0.7},
                  {"color": "red", "value": 0.9}
                ]
              }
            }
          }
        }
      ]
    }

  llmops-analytics.json: |
    {
      "id": null,
      "uid": "llmops-analytics",
      "title": "LLMOps Feature Analytics",
      "tags": ["llmops", "analytics"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "5m",
      "time": {"from": "now-24h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Requests per User (24h)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(increase(litellm_proxy_total_requests_metric_total[24h])) by (user)",
              "legendFormat": "{{ user }}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Tokens per User (24h)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum(increase(litellm_total_tokens_metric_total[24h])) by (user)",
              "legendFormat": "{{ user }}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Cost per Team (7d)",
          "type": "stat",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "sum(increase(litellm_spend_metric_total[7d])) by (team_alias)",
              "legendFormat": "{{ team_alias }}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Model Error Rate (1h)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "sum(rate(litellm_deployment_failure_responses_total[1h])) by (litellm_model_name) / sum(rate(litellm_deployment_total_requests_total[1h])) by (litellm_model_name)",
              "legendFormat": "{{ litellm_model_name }}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Provider P95 Latency (1h)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(litellm_llm_api_latency_metric_bucket[1h])) by (le, api_provider))",
              "legendFormat": "{{ api_provider }}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Expensive Model Ratio per Team (24h)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "targets": [
            {
              "expr": "sum(increase(litellm_deployment_total_requests_total{litellm_model_name=~\"coding-assistant|long-context\"}[24h])) by (team_alias) / sum(increase(litellm_deployment_total_requests_total[24h])) by (team_alias)",
              "legendFormat": "{{ team_alias }}"
            }
          ]
        },
        {
          "id": 7,
          "title": "Fallback Usage (24h)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "targets": [
            {
              "expr": "sum(increase(litellm_deployment_failure_responses_total[24h])) by (litellm_model_name)",
              "legendFormat": "{{ litellm_model_name }} failures"
            }
          ]
        },
        {
          "id": 8,
          "title": "Sensitive Prompt Detections (24h rolling)",
          "type": "stat",
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "gridPos": {"h": 4, "w": 8, "x": 0, "y": 32},
          "targets": [
            {
              "expr": "count_over_time({namespace=\"litellm\"} |~ \"(?i)(password|secret|api.?key|token|credential|ssn|credit.?card)\" [24h])",
              "refId": "A"
            }
          ],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "red", "value": 10}
                ]
              }
            }
          }
        }
      ]
    }

  llmops-logs.json: |
    {
      "id": null,
      "uid": "llmops-logs",
      "title": "LLMOps Log Explorer",
      "tags": ["llmops", "logs"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 5,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "text_search",
            "type": "textbox",
            "label": "Text Search",
            "current": {"text": ".", "value": "."}
          },
          {
            "name": "trace_id",
            "type": "textbox",
            "label": "Trace ID",
            "current": {"text": ".+", "value": ".+"}
          },
          {
            "name": "user_id",
            "type": "textbox",
            "label": "User ID",
            "current": {"text": ".+", "value": ".+"}
          },
          {
            "name": "model_alias",
            "type": "textbox",
            "label": "Model Alias",
            "current": {"text": "fast-chat|coding-assistant|private-chat|long-context|fallback-model", "value": "fast-chat|coding-assistant|private-chat|long-context|fallback-model"}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "All Logs",
          "type": "logs",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "targets": [
            {
              "expr": "{namespace=~\".+\", pod=~\".+\"}",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "id": 2,
          "title": "Text Search",
          "type": "logs",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 10},
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "targets": [
            {
              "expr": "{namespace=~\".+\", pod=~\".+\"} |~ \"(?i)$text_search\"",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "id": 3,
          "title": "LiteLLM Logs",
          "type": "logs",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 18},
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "targets": [
            {
              "expr": "{namespace=\"litellm\", pod=~\".+\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "id": 4,
          "title": "Trace ID Search",
          "type": "logs",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 26},
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "targets": [
            {
              "expr": "{namespace=~\".+\", pod=~\".+\"} |~ \"(?i)trace[_-]?id[=:\\\" ]+$trace_id\"",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "id": 5,
          "title": "User ID Search",
          "type": "logs",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 26},
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "targets": [
            {
