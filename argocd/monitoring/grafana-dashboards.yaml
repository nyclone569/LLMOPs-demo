apiVersion: v1
kind: ConfigMap
metadata:
  name: llmops-grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  llmops-overview.json: |
    {
      "id": null,
      "uid": "llmops-overview",
      "title": "LLMOps Platform Overview",
      "tags": ["llmops", "overview"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(litellm_deployment_total_requests_total[5m]))",
              "legendFormat": "Total req/s"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "reqps"}
          }
        },
        {
          "id": 2,
          "title": "Error Rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(litellm_deployment_failure_responses_total[5m])) / sum(rate(litellm_deployment_total_requests_total[5m]))",
              "legendFormat": "Error Rate"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "percentunit", "max": 1}
          }
        },
        {
          "id": 3,
          "title": "P95 Latency (s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(litellm_request_total_latency_metric_bucket[5m])) by (le))",
              "legendFormat": "P95"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate(litellm_request_total_latency_metric_bucket[5m])) by (le))",
              "legendFormat": "P50"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "s"}
          }
        },
        {
          "id": 4,
          "title": "Requests by Model",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "sum(rate(litellm_deployment_total_requests_total[5m])) by (litellm_model_name)",
              "legendFormat": "{{ litellm_model_name }}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "reqps"}
          }
        },
        {
          "id": 5,
          "title": "Requests by Provider",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [
            {
              "expr": "sum(rate(litellm_deployment_total_requests_total[5m])) by (api_provider)",
              "legendFormat": "{{ api_provider }}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "reqps"}
          }
        },
        {
          "id": 6,
          "title": "Provider Success Rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "targets": [
            {
              "expr": "sum(rate(litellm_deployment_success_responses_total[5m])) by (api_provider) / sum(rate(litellm_deployment_total_requests_total[5m])) by (api_provider)",
              "legendFormat": "{{ api_provider }}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "percentunit", "min": 0, "max": 1}
          }
        },
        {
          "id": 7,
          "title": "Daily Token Usage",
          "type": "stat",
          "gridPos": {"h": 4, "w": 8, "x": 0, "y": 24},
          "targets": [
            {
              "expr": "sum(increase(litellm_total_tokens_metric_total[24h]))",
              "legendFormat": "Tokens (24h)"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "short"}
          }
        },
        {
          "id": 8,
          "title": "Daily Cost (USD)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 8, "x": 8, "y": 24},
          "targets": [
            {
              "expr": "sum(increase(litellm_spend_metric_total[24h]))",
              "legendFormat": "Cost (24h)"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "currencyUSD"}
          }
        },
        {
          "id": 9,
          "title": "Redis Memory Usage",
          "type": "gauge",
          "gridPos": {"h": 4, "w": 8, "x": 16, "y": 24},
          "targets": [
            {
              "expr": "redis_memory_used_bytes / redis_memory_max_bytes",
              "legendFormat": "Memory %"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "percentunit", "min": 0, "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 0.7},
                  {"color": "red", "value": 0.85}
                ]
              }
            }
          }
        },
        {
          "id": 10,
          "title": "Open WebUI Ready Pods",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 28},
          "targets": [
            {"expr": "sum(kube_pod_status_ready{namespace=\"open-webui\",condition=\"true\"})", "legendFormat": "ready"}
          ],
          "fieldConfig": {
            "defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}
          }
        },
        {
          "id": 11,
          "title": "Langfuse Ready Pods",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 28},
          "targets": [
            {"expr": "sum(kube_pod_status_ready{namespace=\"langfuse\",condition=\"true\"})", "legendFormat": "ready"}
          ],
          "fieldConfig": {
            "defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}
          }
        },
        {
          "id": 12,
          "title": "Pod CPU Usage",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 28},
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"litellm|langfuse|open-webui\", container!=\"\"}[5m])) by (namespace, pod)",
              "legendFormat": "{{ namespace }}/{{ pod }}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "cores"}
          }
        }
      ]
    }

  llmops-cost-analysis.json: |
    {
      "id": null,
      "uid": "llmops-cost",
      "title": "LLMOps Cost Analysis",
      "tags": ["llmops", "cost"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "5m",
      "time": {"from": "now-24h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Cost by Model (24h)",
          "type": "piechart",
          "gridPos": {"h": 10, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(increase(litellm_spend_metric_total[24h])) by (litellm_model_name)",
              "legendFormat": "{{ litellm_model_name }}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "currencyUSD"}
          }
        },
        {
          "id": 2,
          "title": "Cost by Team (24h)",
          "type": "piechart",
          "gridPos": {"h": 10, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum(increase(litellm_spend_metric_total[24h])) by (team_alias)",
              "legendFormat": "{{ team_alias }}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "currencyUSD"}
          }
        },
        {
          "id": 3,
          "title": "Top 10 Users by Cost (24h)",
          "type": "barchart",
          "gridPos": {"h": 10, "w": 12, "x": 0, "y": 10},
          "targets": [
            {
              "expr": "topk(10, sum(increase(litellm_spend_metric_total[24h])) by (user))",
              "legendFormat": "{{ user }}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "currencyUSD"}
          }
        },
        {
          "id": 4,
          "title": "Token Usage by Model (24h)",
          "type": "barchart",
          "gridPos": {"h": 10, "w": 12, "x": 12, "y": 10},
          "targets": [
            {
              "expr": "sum(increase(litellm_total_tokens_metric_total[24h])) by (litellm_model_name)",
              "legendFormat": "{{ litellm_model_name }}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "short"}
          }
        },
        {
          "id": 5,
          "title": "Daily Cost Trend (7d)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 16, "x": 0, "y": 20},
          "targets": [
            {
              "expr": "sum(increase(litellm_spend_metric_total[24h]))",
              "legendFormat": "Daily Cost"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "currencyUSD"}
          }
        },
        {
          "id": 6,
          "title": "Budget Utilization",
          "type": "gauge",
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 20},
          "targets": [
            {
              "expr": "sum(increase(litellm_spend_metric_total[24h])) / 200",
              "legendFormat": "% of $200 budget"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 0.7},
                  {"color": "red", "value": 0.9}
                ]
              }
            }
          }
        }
      ]
    }

  llmops-analytics.json: |
    {
      "id": null,
      "uid": "llmops-analytics",
      "title": "LLMOps Feature Analytics",
      "tags": ["llmops", "analytics"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "5m",
      "time": {"from": "now-24h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Requests per User (24h)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(increase(litellm_proxy_total_requests_metric_total[24h])) by (user)",
              "legendFormat": "{{ user }}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Tokens per User (24h)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum(increase(litellm_total_tokens_metric_total[24h])) by (user)",
              "legendFormat": "{{ user }}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Cost per Team (7d)",
          "type": "stat",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "sum(increase(litellm_spend_metric_total[7d])) by (team_alias)",
              "legendFormat": "{{ team_alias }}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Model Error Rate (1h)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "sum(rate(litellm_deployment_failure_responses_total[1h])) by (litellm_model_name) / sum(rate(litellm_deployment_total_requests_total[1h])) by (litellm_model_name)",
              "legendFormat": "{{ litellm_model_name }}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Provider P95 Latency (1h)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(litellm_llm_api_latency_metric_bucket[1h])) by (le, api_provider))",
              "legendFormat": "{{ api_provider }}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Expensive Model Ratio per Team (24h)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "targets": [
            {
              "expr": "sum(increase(litellm_deployment_total_requests_total{litellm_model_name=~\"coding-assistant|long-context\"}[24h])) by (team_alias) / sum(increase(litellm_deployment_total_requests_total[24h])) by (team_alias)",
              "legendFormat": "{{ team_alias }}"
            }
          ]
        },
        {
          "id": 7,
          "title": "Fallback Usage (24h)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "targets": [
            {
              "expr": "sum(increase(litellm_deployment_failure_responses_total[24h])) by (litellm_model_name)",
              "legendFormat": "{{ litellm_model_name }} failures"
            }
          ]
        }
      ]
    }

  llmops-logs.json: |
    {
      "id": null,
      "uid": "llmops-logs",
      "title": "LLMOps Log Explorer",
      "tags": ["llmops", "logs"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 5,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "text_search",
            "type": "textbox",
            "label": "Text Search",
            "current": {"text": ".", "value": "."}
          },
          {
            "name": "trace_id",
            "type": "textbox",
            "label": "Trace ID",
            "current": {"text": ".+", "value": ".+"}
          },
          {
            "name": "user_id",
            "type": "textbox",
            "label": "User ID",
            "current": {"text": ".+", "value": ".+"}
          },
          {
            "name": "model_alias",
            "type": "textbox",
            "label": "Model Alias",
            "current": {"text": "fast-chat|coding-assistant|private-chat|long-context|fallback-model", "value": "fast-chat|coding-assistant|private-chat|long-context|fallback-model"}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "All Logs",
          "type": "logs",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "targets": [
            {
              "expr": "{namespace=~\".+\", pod=~\".+\"}",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "id": 2,
          "title": "Text Search",
          "type": "logs",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 10},
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "targets": [
            {
              "expr": "{namespace=~\".+\", pod=~\".+\"} |~ \"(?i)$text_search\"",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "id": 3,
          "title": "LiteLLM Logs",
          "type": "logs",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 18},
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "targets": [
            {
              "expr": "{namespace=\"litellm\", pod=~\".+\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "id": 4,
          "title": "Trace ID Search",
          "type": "logs",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 26},
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "targets": [
            {
              "expr": "{namespace=~\".+\", pod=~\".+\"} |~ \"(?i)trace[_-]?id[=:\\\" ]+$trace_id\"",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "id": 5,
          "title": "User ID Search",
          "type": "logs",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 26},
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "targets": [
            {
              "expr": "{namespace=~\".+\", pod=~\".+\"} |~ \"(?i)user[_-]?id[=:\\\" ]+$user_id\"",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "id": 6,
          "title": "Model Alias Search",
          "type": "logs",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 34},
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "targets": [
            {
              "expr": "{namespace=~\".+\", pod=~\".+\"} |~ \"(?i)(model|model_alias|litellm_model_name)[=:\\\" ]+($model_alias)\"",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "id": 7,
          "title": "Failed Requests",
          "type": "logs",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 34},
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "targets": [
            {
              "expr": "{namespace=~\".+\", pod=~\".+\"} |~ \"(?i)(error|failed|failure|exception|status[=:\\\" ]+[45][0-9][0-9])\"",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "id": 8,
          "title": "Provider Timeouts and Rate Limits",
          "type": "logs",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 42},
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "targets": [
            {
              "expr": "{namespace=~\".+\", pod=~\".+\"} |~ \"(?i)(timeout|timed out|rate.?limit|too many requests|429)\"",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "id": 9,
          "title": "Sensitive Data Warnings",
          "type": "logs",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 42},
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "targets": [
            {
              "expr": "{namespace=~\".+\", pod=~\".+\"} |~ \"(?i)(sensitive|redact|masked|AKIA|sk-proj|postgresql://|credit card|ssn)\"",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          }
        },
        {
          "id": 10,
          "title": "Log Volume",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 50},
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "targets": [
            {
              "expr": "sum(rate({namespace=~\".+\", pod=~\".+\"}[1m])) by (namespace, pod)",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "short", "custom": {"lineWidth": 1}}
          }
        }
      ]
    }
