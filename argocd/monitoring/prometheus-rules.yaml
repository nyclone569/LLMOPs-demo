apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llmops-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app: kube-prometheus-stack
spec:
  groups:
    - name: llmops-platform
      interval: 30s
      rules:
        - alert: LiteLLMHighErrorRate
          expr: |
            (
              sum(rate(litellm_deployment_failure_responses_total[5m]))
              /
              sum(rate(litellm_deployment_total_requests_total[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: critical
            component: litellm
          annotations:
            summary: "LiteLLM error rate above 5%"
            description: "LiteLLM gateway has {{ $value | humanizePercentage }} error rate over the last 5 minutes."

        - alert: LLMProviderHighTimeoutRate
          expr: |
            (
              sum(rate(litellm_deployment_failure_responses_total{exception_class=~".*[Tt]imeout.*"}[5m]))
              /
              sum(rate(litellm_deployment_total_requests_total[5m]))
            ) > 0.10
          for: 5m
          labels:
            severity: warning
            component: litellm
          annotations:
            summary: "LLM provider timeout rate above 10%"
            description: "Provider timeout rate is {{ $value | humanizePercentage }} over the last 5 minutes."

        - alert: OpenWebUIDown
          expr: up{job="open-webui"} == 0
          for: 2m
          labels:
            severity: critical
            component: open-webui
          annotations:
            summary: "Open WebUI is down"
            description: "Open WebUI has been unavailable for more than 2 minutes."

        - alert: LangfuseDown
          expr: up{job="langfuse"} == 0
          for: 5m
          labels:
            severity: warning
            component: langfuse
          annotations:
            summary: "Langfuse is down"
            description: "Langfuse has been unavailable for more than 5 minutes. LLM tracing may be degraded."

        - alert: LangfuseIngestionDelayHigh
          expr: |
            sum(redis_key_size{key=~"bull:langfuse-new-events:.*"}) > 500
          for: 10m
          labels:
            severity: warning
            component: langfuse
          annotations:
            summary: "Langfuse ingestion queue backlog growing"
            description: "Langfuse Redis queue has {{ $value }} pending items for >10m."

        - alert: LiteLLMHighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(litellm_request_total_latency_metric_bucket[5m])) by (le)
            ) > 3
          for: 10m
          labels:
            severity: warning
            component: litellm
          annotations:
            summary: "LiteLLM P95 latency above 3 seconds"
            description: "LiteLLM P95 latency is {{ $value }}s."

        - alert: RedisHighMemoryUsage
          expr: |
            (
              redis_memory_used_bytes{job="redis"}
              /
              redis_memory_max_bytes{job="redis"}
            ) > 0.80
          for: 5m
          labels:
            severity: warning
            component: redis
          annotations:
            summary: "Redis memory usage above 80%"
            description: "Redis is using {{ $value | humanizePercentage }} of available memory."

        - alert: RedisHighConnectionCount
          expr: redis_connected_clients{job="redis"} > 1000
          for: 5m
          labels:
            severity: warning
            component: redis
          annotations:
            summary: "Redis has high connection count"
            description: "Redis has {{ $value }} connected clients."

        - alert: PodRestartingFrequently
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace=~"litellm|langfuse|open-webui|redis"}[15m]) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarting frequently"
            description: "Pod has restarted {{ $value }} times in the last 15 minutes."

        - alert: PodHighCPUUsage
          expr: |
            (
              sum(rate(container_cpu_usage_seconds_total{namespace=~"litellm|langfuse|open-webui"}[5m])) by (namespace, pod)
              /
              sum(kube_pod_container_resource_limits{resource="cpu", namespace=~"litellm|langfuse|open-webui"}) by (namespace, pod)
            ) > 0.90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} high CPU usage"
            description: "Pod is using {{ $value | humanizePercentage }} of CPU limit."

        - alert: PodHighMemoryUsage
          expr: |
            (
              sum(container_memory_working_set_bytes{namespace=~"litellm|langfuse|open-webui"}) by (namespace, pod)
              /
              sum(kube_pod_container_resource_limits{resource="memory", namespace=~"litellm|langfuse|open-webui"}) by (namespace, pod)
            ) > 0.90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} high memory usage"
            description: "Pod is using {{ $value | humanizePercentage }} of memory limit."

        - alert: NodeUnderPressure
          expr: |
            kube_node_status_condition{condition=~"MemoryPressure|DiskPressure",status="true"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.node }} is under {{ $labels.condition }}"
            description: "Node has been under pressure for more than 5 minutes."

        - alert: PostgreSQLHighConnectionUsage
          expr: |
            (
              sum(pg_stat_activity_count) by (instance)
              /
              sum(pg_settings_max_connections) by (instance)
            ) > 0.80
          for: 5m
          labels:
            severity: warning
            component: postgresql
          annotations:
            summary: "PostgreSQL connection usage above 80%"
            description: "PostgreSQL is using {{ $value | humanizePercentage }} of max_connections on {{ $labels.instance }}."

    - name: llmops-cost-tracking
      interval: 60s
      rules:
        - alert: DailyLLMCostSpike
          expr: |
            sum(increase(litellm_spend_metric_total[24h])) > 200
          labels:
            severity: warning
            component: cost
          annotations:
            summary: "Daily LLM cost exceeds budget"
            description: "Total LLM cost in last 24h is ${{ $value }}, exceeding $200 budget."

        - alert: UserHighTokenConsumption
          expr: |
            (
              sum(increase(litellm_total_tokens_metric_total[24h])) by (user)
              /
              sum(increase(litellm_total_tokens_metric_total[24h]))
            ) > 0.30
          labels:
            severity: warning
            component: cost
          annotations:
            summary: "User {{ $labels.user }} consuming >30% of daily tokens"
            description: "User is consuming {{ $value | humanizePercentage }} of total daily token budget."

        - alert: TeamHighTokenConsumption
          expr: |
            (
              sum(increase(litellm_total_tokens_metric_total[24h])) by (team_alias)
              /
              sum(increase(litellm_total_tokens_metric_total[24h]))
            ) > 0.50
          for: 15m
          labels:
            severity: warning
            component: cost
          annotations:
            summary: "Team {{ $labels.team_alias }} consuming >50% of daily tokens"
            description: "Team is at {{ $value | humanizePercentage }} of total daily token usage."

    - name: llmops-security
      interval: 30s
      rules:
        - alert: UnusualRequestPattern
          expr: |
            rate(litellm_deployment_total_requests_total[5m]) > 2 * avg_over_time(rate(litellm_deployment_total_requests_total[5m])[1h:5m])
          for: 10m
          labels:
            severity: warning
            component: security
          annotations:
            summary: "Unusual spike in LLM requests"
            description: "Request rate is {{ $value }} req/s, significantly higher than normal."
