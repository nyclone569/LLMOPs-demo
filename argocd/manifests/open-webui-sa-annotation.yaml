# Annotates the Open WebUI service account with the IRSA role ARN so the pod
# can read from the analytics S3 bucket via EKS pod identity (no static credentials).
#
# The open-webui Helm chart (v14.x) creates and uses 'open-webui-sa', not 'open-webui'.
# automountServiceAccountToken must be true for IRSA projected token injection to work.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: open-webui-sa
  namespace: open-webui
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::492372116094:role/llmops-cluster-analytics-open-webui
automountServiceAccountToken: true
