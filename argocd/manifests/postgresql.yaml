# Standalone PostgreSQL for LiteLLM and Langfuse
# Uses bitnami/postgresql:latest (available on Docker Hub unlike version-specific tags)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  namespace: postgresql
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-initdb
  namespace: postgresql
data:
  init.sql: |
    CREATE SCHEMA IF NOT EXISTS litellm;
    CREATE SCHEMA IF NOT EXISTS langfuse;
    GRANT ALL PRIVILEGES ON SCHEMA litellm TO postgres;
    GRANT ALL PRIVILEGES ON SCHEMA langfuse TO postgres;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql-primary
  namespace: postgresql
spec:
  replicas: 1
  serviceName: postgresql-primary-headless
  selector:
    matchLabels:
      app: postgresql-primary
  template:
    metadata:
      labels:
        app: postgresql-primary
    spec:
      securityContext:
        fsGroup: 1001
        runAsUser: 1001
      containers:
        - name: postgresql
          image: bitnami/postgresql:latest
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              value: postgres
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: llmops-apikeys-secret
                  key: POSTGRESQL_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /bitnami/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            initialDelaySeconds: 30
            periodSeconds: 15
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATA_SOURCE_URI
              value: "localhost:5432/postgres?sslmode=disable"
            - name: DATA_SOURCE_USER
              value: "exporter"
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: llmops-apikeys-secret
                  key: POSTGRES_EXPORTER_PASSWORD
          ports:
            - name: metrics
              containerPort: 9187
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgresql-data
        - name: initdb
          configMap:
            name: postgresql-initdb
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-primary
  namespace: postgresql
spec:
  selector:
    app: postgresql-primary
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
    - name: metrics
      port: 9187
      targetPort: 9187
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-primary-headless
  namespace: postgresql
spec:
  selector:
    app: postgresql-primary
  clusterIP: None
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
